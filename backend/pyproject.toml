[project]
name = "owl-backend"
version = "0.1.0"
description = "Owl API: chat with your own documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.164.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
